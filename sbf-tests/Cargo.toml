[package]
name = "allowit-vault-sbf-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
publish = false

[workspace]
resolver = "3"

[dev-dependencies]
# Keep the test runtime on the Rust 1.98.0-compatible Agave line.
solana-program-runtime = "=4.3.2"
allowit-vault = { path = "../programs/vault", features = ["no-entrypoint"] }
borsh = "=1.6.0"
mollusk-svm = "=0.16.4"
mollusk-svm-programs-token = { version = "=0.16.4", default-features = false, features = ["token", "associated-token"] }
solana-account = "4.3.0"
solana-instruction = "3.2.0"
solana-loader-v3-interface = { version = "=7.0.0", features = ["bincode"] }
solana-message = { version = "=4.6.0", features = ["wincode"] }
solana-program-error = "=3.0.1"
solana-program-option = "3"
solana-program-pack = "3"
solana-pubkey = { version = "=4.3.0", features = ["curve25519"] }
solana-sdk-ids = "=3.1.0"
spl-associated-token-account-interface = "=2.0.0"
spl-token-interface = "=2.0.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
