[package]
name = "allowit-test-vault-sbf-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT"
publish = false
description = "LiteSVM tests of the built test vault program"

# Its own workspace and lock file: the test runtime never changes the program's dependencies.
[workspace]
resolver = "3"

[dev-dependencies]
allowit-test-vault = { path = "..", features = ["no-entrypoint"] }
base64 = "0.22"
litesvm = "=0.18.2"
serde_json = "1"
solana-account = "4"
solana-instruction = "=3.5.1"
solana-keypair = "3"
solana-message = "4.6"
solana-program-pack = "3"
solana-pubkey = { version = "=4.3.0", features = ["curve25519"] }
solana-sdk-ids = "=3.1.0"
solana-signer = "3"
solana-transaction = "4.3"
spl-associated-token-account-interface = "=2.0.0"
spl-token-interface = "=3.0.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
