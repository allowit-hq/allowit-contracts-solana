[package]
name = "allowit-test-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Test-only priced vault of the Solana rail of Allowit: its admin sets the share price"

# The program builds on its own lock file, so a change of the rail crate's dependencies never
# changes the bytes of a deployed program.
[workspace]
exclude = ["sbf-tests"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-account-info = "=3.1.1"
solana-cpi = "=3.1.0"
solana-instruction = "=3.5.1"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-program-pack = "3"
solana-pubkey = { version = "=4.3.0", features = ["curve25519"] }
solana-rent = "=4.4.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-sysvar = "=4.2.0"
spl-associated-token-account-interface = "=2.0.0"
spl-token-interface = "=3.0.0"

[profile.release]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
