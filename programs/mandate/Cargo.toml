[package]
name = "allowit-solana"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-heap"]
custom-heap = []
no-entrypoint = []

[dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "6aa00597a0796acf6f6fa911a86c0fe57c055b67", default-features = false, features = ["contract"] }
borsh = { version = "=1.6.0", features = ["derive"] }
solana-program = "=2.3.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "6aa00597a0796acf6f6fa911a86c0fe57c055b67", features = ["compiler", "contract"] }
serde_json = "=1.0.150"
bincode = "=1.3.3"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow" }
