[workspace]
members = [
    "crates/allowit-solana",
    "crates/interface",
    "crates/native",
    "programs/policy",
    "programs/vault",
]
# The SBF test harness pins the Mollusk crate family exactly. Those pins would
# change the programs' own dependencies, so the harness keeps its own lock.
exclude = ["sbf-tests"]
resolver = "2"

# Every package in this repository builds at this version.
[workspace.package]
version = "0.1.0"

# The revision each git repository must be pinned to. scripts/build.sh checks
# every git dependency against this table and fails on a stale pin.
[workspace.metadata.allowit.track]
# Core 0.13.1 (allowit-core#57) adds Signer::sign_bytes. Until its release tag
# exists, the rail tracks that pull request's branch.
allowit-core = { branch = "sign-bytes" }

[workspace.dependencies]
# Allowit core is the only git dependency.
allowit-core = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "c75e0ffae98ee18e39228aa597462017b1f2cef6", default-features = false, features = ["vendor"] }
allowit-interface = { path = "crates/interface" }
allowit-native = { path = "crates/native" }
solana-program = "=2.3.0"
borsh = { version = "=1.6.0", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
