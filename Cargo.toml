[workspace]
members = [
    "crates/delegated-x402",
    "crates/interface",
    "crates/native",
    "crates/paysh-catalog",
    "crates/paysh-cooperating",
    "crates/paysh-interface",
    "crates/paysh-stock",
    "crates/provider-google-air-quality",
    "crates/provider-open-meteo",
    "crates/service-rpc",
    "crates/service-upstreams",
    "crates/solana-vendor",
    "programs/paysh",
    "programs/policy",
    "programs/vault",
]
# The SBF test harnesses pin the Mollusk crate family exactly. Those pins would
# change the programs' own dependencies, so each harness keeps its own lock.
# The mandate program keeps its own lock too: it resolves serde, cc, libc and
# lazy_static to older versions than the other programs.
exclude = ["sbf-tests", "programs/mandate"]
resolver = "2"

# Every package in this repository builds at this version.
[workspace.package]
version = "0.1.0"

# The revision each git repository must be pinned to. scripts/build.sh checks
# every git dependency below against this table and fails on a stale pin.
[workspace.metadata.allowit.track]
# allowit-core cli-settings-overrides carries the core part of allowit-sdk#44.
# After it merges, track "head" and run scripts/build.sh --update allowit-core.
allowit-core = { branch = "cli-settings-overrides" }

[workspace.dependencies]
# Allowit core (package allowit-sdk) is the only git dependency.
allowit-sdk = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "897b1b4c16f3e5a4e8e7c5de082b41d2d600ff6e", default-features = false }
allowit-interface = { path = "crates/interface" }
allowit-native = { path = "crates/native" }
solana-program = "=2.3.0"
borsh = { version = "=1.6.0", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
