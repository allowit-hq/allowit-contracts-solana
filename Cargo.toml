[workspace]
members = [
    "crates/allowit-solana",
    "crates/interface",
    "programs/policy",
    "programs/vault",
]
# The SBF test harness pins the Mollusk crate family exactly. Those pins would
# change the programs' own dependencies, so the harness keeps its own lock.
exclude = ["sbf-tests"]
resolver = "2"

# Every package in this repository builds at this version.
[workspace.package]
version = "0.1.0"

# The revision each git repository must be pinned to. scripts/build.sh checks
# every git dependency against this table and fails on a stale pin.
[workspace.metadata.allowit.track]
# Core publishes no release tags after v0.5.0, so the rail tracks the tip of its
# default branch; scripts/build.sh --update allowit-core moves the pin.
allowit-core = "head"

[workspace.dependencies]
# Allowit core is the only git dependency.
allowit-core = { git = "https://github.com/allowit-hq/allowit-core.git", rev = "0585ca96fdcd11c41807d740e11753e43c6d8a12", default-features = false, features = ["vendor"] }
allowit-interface = { path = "crates/interface" }
solana-program = "=2.3.0"
borsh = { version = "=1.6.0", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
