[package]
name = "allowit-vendor-paysh-stock"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

[package.metadata.allowit-source]
repository = "https://github.com/allowit-hq/allowit-engine"
revision = "8cbd4625b170ae72aa470a642f19a55b2f40e9a3"
paths = ["crates/server/crates/paysh/src/stock.rs", "crates/server/crates/paysh/tests/fixtures/official-mpp-google-v0.json"]

[dependencies]
allowit-sdk = { workspace = true, features = ["service", "transport"] }
allowit-native.workspace = true
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
