[package]
name = "allowit-solana"
version.workspace = true
edition = "2024"
# The toolchain that rust-toolchain.toml pins and that the locked dependencies are built with.
rust-version = "1.98"
license = "MIT"
publish = false
description = "The Solana rail of Allowit: networks, tokens, explorer links and agent keys"

[dependencies]
allowit-core = { workspace = true }
bs58 = "0.5.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
zeroize = "1"
