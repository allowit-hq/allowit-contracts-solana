[package]
name = "allowit-solana-service-upstreams"
version.workspace = true
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[package.metadata.allowit-source]
repository = "https://github.com/allowit-hq/allowit-engine"
revision = "8cbd4625b170ae72aa470a642f19a55b2f40e9a3"
paths = ["crates/server/src/lib.rs", "crates/server/crates/paysh/src/vendor.rs"]

[dependencies]
allowit-sdk = { workspace = true, features = ["service"] }
allowit-vendor-google-air-quality = { path = "../provider-google-air-quality" }
allowit-vendor-open-meteo = { path = "../provider-open-meteo" }
allowit-vendor-paysh-catalog = { path = "../paysh-catalog" }
serde_json = "1.0.150"
